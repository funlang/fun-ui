# Build the native window hosts for a published release and attach them to
# the release assets.
#
# The Fun interpreter already ships prebuilt binaries, so a project only needs
# a Fun script to get a window. The native view hosts were the last piece that
# still required a C/Objective-C toolchain; this workflow removes that: users
# download the host library for their platform instead of building it.
#
#   libui2webkitgtk-linux-x86_64.so      GTK3 + WebKit2GTK 4.1, built on
#                                        ubuntu-22.04 (glibc 2.35 baseline)
#   libui2wkwebview-macos-universal.dylib  AppKit + WKWebView, arm64 + x86_64
#
# Windows is not here: libwv2.dll is a Delphi 2006 project
# (src/prj/lib.wv2/make-2006.bat) that needs the Windows toolchain and the
# WebView4Delphi sources, so it is still built by hand.
#
# The asset name carries no version: the release page already pins one.
#
# Called by release.yml right after it creates the release: a release created
# with GITHUB_TOKEN does not trigger a second workflow run on its own, so the
# build has to be part of the release run.
#
# Backfill runs: dispatch it with a tag, or push a change to this file on
# master, which re-publishes the assets of the latest release. The second path
# is how a release whose assets failed (for example a removed runner image)
# gets repaired without moving its tag.

name: assets

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach the host libraries to
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the host libraries to
        required: true
        type: string
  push:
    branches: [master]
    paths: ['.github/workflows/assets.yml']

permissions:
  contents: write

concurrency:
  group: assets-${{ github.event_name }}-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "::notice::publishing host libraries for $tag"

  linux-webkitgtk:
    name: linux-x86_64
    needs: resolve
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install GTK and WebKitGTK
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build the WebKitGTK host
        run: src/prj/lib.webkitgtk/build.sh

      - name: Check the library loads and exports the entry points
        run: |
          set -eu
          so=src/prj/lib.webkitgtk/libui2webkitgtk.so
          ldd "$so"
          for sym in ui2_gtk_init ui2_gtk_show ui2_gtk_iterate ui2_gtk_close ui2_gtk_set_title; do
            nm -D --defined-only "$so" | grep -qw "$sym"
          done
          strip --strip-unneeded "$so"
          cp "$so" libui2webkitgtk-linux-x86_64.so

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sha256sum libui2webkitgtk-linux-x86_64.so > libui2webkitgtk-linux-x86_64.so.sha256
          gh release upload "$TAG" \
            libui2webkitgtk-linux-x86_64.so \
            libui2webkitgtk-linux-x86_64.so.sha256 \
            --clobber

  macos-wkwebview:
    name: macos-universal
    needs: resolve
    # See ci.yml: a retired macOS image cancels the job before it starts.
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # One universal binary instead of two assets: Apple clang links each
      # -arch slice and lipo's them together, and the SDK on the arm64 runner
      # carries both slices.
      - name: Build the WKWebView host (arm64 + x86_64)
        run: |
          set -eu
          mkdir -p build
          clang -O2 -fobjc-arc -fPIC -Wall -Wextra -Wno-deprecated-declarations \
            -dynamiclib -arch arm64 -arch x86_64 \
            -framework Cocoa -framework WebKit \
            -o build/libui2wkwebview.dylib src/prj/lib.wkwebview/host.m
          lipo -info build/libui2wkwebview.dylib
          codesign --force --sign - build/libui2wkwebview.dylib
          for arch in arm64 x86_64; do
            lipo -thin "$arch" build/libui2wkwebview.dylib -output "build/$arch.dylib"
            for sym in ui2_wk_init ui2_wk_show ui2_wk_iterate ui2_wk_close ui2_wk_set_title; do
              nm -gU "build/$arch.dylib" | grep -qw "_$sym"
            done
          done
          cp build/libui2wkwebview.dylib libui2wkwebview-macos-universal.dylib

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          shasum -a 256 libui2wkwebview-macos-universal.dylib \
            > libui2wkwebview-macos-universal.dylib.sha256
          gh release upload "$TAG" \
            libui2wkwebview-macos-universal.dylib \
            libui2wkwebview-macos-universal.dylib.sha256 \
            --clobber
