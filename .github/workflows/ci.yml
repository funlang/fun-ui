# Continuous integration for fun-ui.
#
# linux-loopback:
#   builds the pinned Fun interpreter, then runs the portable WebSocket
#   loopback test and the browser bridge unit test.
#
# linux-webkitgtk:
#   same Fun build, plus GTK3/WebKit2GTK and Xvfb, then builds the native
#   window host and runs the headless native-window smoke test.
#
# The Fun build lives in .github/actions/setup-fun and is cached, so a run
# that only changes fun-ui does not rebuild the interpreter.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FUN_REF: v9.4.6

jobs:
  linux-loopback:
    name: linux-loopback
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out fun-ui
        uses: actions/checkout@v4

      - name: Set up Fun
        id: fun
        uses: ./.github/actions/setup-fun
        with:
          ref: ${{ env.FUN_REF }}

      - name: Fun loopback test
        env:
          FUN_PATH: ${{ steps.fun.outputs.fun_root }}/lib
        run: ${{ steps.fun.outputs.funcmd }} test/lib-ui2-proxy-unx-test.fun

      - name: Browser bridge unit test
        run: node test/fun-bridge-ws.test.js

  linux-webkitgtk:
    name: linux-webkitgtk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out fun-ui
        uses: actions/checkout@v4

      - name: Set up Fun
        id: fun
        uses: ./.github/actions/setup-fun
        with:
          ref: ${{ env.FUN_REF }}

      - name: Install GTK, WebKitGTK, and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            xvfb dbus-x11

      - name: Build WebKitGTK host
        run: src/prj/lib.webkitgtk/build.sh

      - name: Headless native-window test
        env:
          FUN_PATH: ${{ steps.fun.outputs.fun_root }}/lib
          # WebKitGTK in a headless container: no GPU, no bubblewrap sandbox.
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            dbus-run-session -- \
            "${{ steps.fun.outputs.funcmd }}" test/lib-ui2-webview-lnx-test.fun
