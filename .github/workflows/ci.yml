# Continuous integration for fun-ui.
#
# linux-loopback:
#   builds the pinned Fun interpreter, then runs the portable WebSocket
#   loopback test and the browser bridge unit test.
#
# linux-webkitgtk:
#   same Fun build, plus GTK3/WebKit2GTK and Xvfb, then builds the native
#   window host and runs the headless native-window smoke test.
#
# macos-wkwebview:
#   Homebrew FPC build of Fun, the portable loopback test, then the
#   AppKit/WKWebView host and its native-window smoke test.
#
# The Fun build lives in .github/actions/setup-fun and is cached, so a run
# that only changes fun-ui does not rebuild the interpreter.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FUN_REF: v9.4.7

jobs:
  linux-loopback:
    name: linux-loopback
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out fun-ui
        uses: actions/checkout@v4

      - name: Set up Fun
        id: fun
        uses: ./.github/actions/setup-fun
        with:
          ref: ${{ env.FUN_REF }}

      - name: Fun loopback test
        env:
          FUN_PATH: ${{ steps.fun.outputs.fun_root }}/lib
        run: ${{ steps.fun.outputs.funcmd }} test/lib-ui2-proxy-unx-test.fun

      - name: Browser bridge unit test
        run: node test/fun-bridge-ws.test.js

  linux-webkitgtk:
    name: linux-webkitgtk
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out fun-ui
        uses: actions/checkout@v4

      - name: Set up Fun
        id: fun
        uses: ./.github/actions/setup-fun
        with:
          ref: ${{ env.FUN_REF }}

      # The GTK/WebKit dev packages pull in a few hundred megabytes of .debs,
      # and the runner's apt mirror is occasionally slow enough to dominate
      # the run. Keep the downloaded packages and install from the cache.
      # Bump the version suffix when the package set changes.
      - name: Restore apt package cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/fun-ui/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-webkit2gtk-4.1-v1

      - name: Install GTK, WebKitGTK, and Xvfb
        env:
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          PKGS: libgtk-3-dev libwebkit2gtk-4.1-dev xvfb dbus-x11
        run: |
          set -eu
          cache="$HOME/.cache/fun-ui/apt-archives"
          mkdir -p "$cache"

          timeout 300 sudo apt-get update $APT_OPTS

          # Seed apt's download cache from a previous run, if there is one.
          if ls "$cache"/*.deb >/dev/null 2>&1; then
            sudo cp "$cache"/*.deb /var/cache/apt/archives/
          fi

          # Install without the network first; fall back to a normal install
          # when the cache is missing, stale, or incomplete.
          if ! timeout 600 sudo apt-get install -y --no-install-recommends \
              --no-download $APT_OPTS $PKGS; then
            echo "cached packages incomplete; downloading the rest" >&2
            timeout 900 sudo apt-get install -y --no-install-recommends \
              $APT_OPTS $PKGS
          fi

          sudo cp /var/cache/apt/archives/*.deb "$cache"/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$cache"

      - name: Build WebKitGTK host
        run: src/prj/lib.webkitgtk/build.sh

      - name: Headless native-window test
        env:
          FUN_PATH: ${{ steps.fun.outputs.fun_root }}/lib
          # WebKitGTK in a headless container: no GPU, no bubblewrap sandbox.
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          GDK_BACKEND: "x11"
          NO_AT_BRIDGE: "1"
        run: |
          set +e
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          {
            echo "--- environment ---"
            pkg-config --modversion gtk+-3.0 webkit2gtk-4.1 || true
            ldd src/prj/lib.webkitgtk/libui2webkitgtk.so || true
            echo "--- test ---"
          } > /tmp/webview.log 2>&1
          timeout 90s xvfb-run -a -s "-screen 0 1280x1024x24" \
            dbus-run-session -- \
            "${{ steps.fun.outputs.funcmd }}" test/lib-ui2-webview-lnx-test.fun \
            >> /tmp/webview.log 2>&1
          rc=$?
          cat /tmp/webview.log
          echo "--- progress ---"
          cat /tmp/ui2-webview-progress.txt 2>/dev/null || true
          if [ "$rc" -ne 0 ]; then
            {
              echo "rc=$rc"
              echo "--- progress ---"
              cat /tmp/ui2-webview-progress.txt 2>/dev/null || true
              echo "--- test log tail ---"
              tail -n 40 /tmp/webview.log
            } > /tmp/webview-error.txt
            msg="$(tr '\n' '|' < /tmp/webview-error.txt | cut -c1-2000)"
            echo "::error title=webview test::$msg"
          fi
          exit "$rc"

      - name: Upload WebKit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webview-log
          path: /tmp/webview.log

  macos-wkwebview:
    name: macos-wkwebview
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out fun-ui
        uses: actions/checkout@v4

      - name: Set up Fun
        id: fun
        uses: ./.github/actions/setup-fun
        with:
          ref: ${{ env.FUN_REF }}

      - name: Build WKWebView host
        run: src/prj/lib.wkwebview/build.sh

      - name: Portable loopback test (macOS)
        env:
          FUN_PATH: ${{ steps.fun.outputs.fun_root }}/lib
        run: |
          set +e
          "${{ steps.fun.outputs.funcmd }}" test/lib-ui2-proxy-unx-test.fun \
            > "$RUNNER_TEMP/loopback.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/loopback.log"
          if [ "$rc" -ne 0 ]; then
            msg="$(tail -n 40 "$RUNNER_TEMP/loopback.log" | tr '\r' ' ' | tr '\n' '|' | sed 's/%/%25/g' | cut -c1-2000)"
            echo "::error title=macos loopback::$msg"
          else
            echo "::notice title=macos loopback::PASS"
          fi
          exit "$rc"

      - name: Native window test (macOS)
        env:
          FUN_PATH: ${{ steps.fun.outputs.fun_root }}/lib
        run: |
          set +e
          "${{ steps.fun.outputs.funcmd }}" test/lib-ui2-webview-mac-test.fun \
            > "$RUNNER_TEMP/mac.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/mac.log"
          echo "--- progress ---"
          cat /tmp/ui2-mac-progress.txt 2>/dev/null || true
          cp -f /tmp/ui2-mac-progress.txt "$RUNNER_TEMP/progress.txt" 2>/dev/null || true
          if [ "$rc" -ne 0 ]; then
            {
              echo "rc=$rc"
              echo "--- progress ---"
              cat /tmp/ui2-mac-progress.txt 2>/dev/null || true
              echo "--- test log tail ---"
              tail -n 60 "$RUNNER_TEMP/mac.log"
            } > "$RUNNER_TEMP/macos-error.txt"
            msg="$(tr '\r' ' ' < "$RUNNER_TEMP/macos-error.txt" | tr '\n' '|' | sed 's/%/%25/g' | cut -c1-2000)"
            echo "::error title=macos webview test::$msg"
          else
            result="$(grep 'RESULT:' "$RUNNER_TEMP/mac.log" | tail -n 1)"
            echo "::notice title=macos webview test::PASS ${result:-RESULT: OK}"
          fi
          exit "$rc"

      - name: Upload macOS logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-webview-log
          path: |
            ${{ runner.temp }}/mac.log
            ${{ runner.temp }}/loopback.log
            ${{ runner.temp }}/macos-error.txt
            ${{ runner.temp }}/progress.txt
          if-no-files-found: ignore
